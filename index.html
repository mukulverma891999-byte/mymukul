
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mukul King</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

.container {
  max-width: 860px;
  margin: auto;
  padding: 55px 25px 35px;
  min-height: 100vh;
  background:
    radial-gradient(ellipse, #181600 0%, #080800 65%, #050505 100%);
  border-left: 1px solid #222;
  border-right: 1px solid #222;
}

.profile {
  width: 340px;
  height: 340px;
  max-width: 75vw;
  max-height: 75vw;
  border-radius: 50%;
  border: 9px solid #b5ff00;
  object-fit: cover;
  box-shadow: 0 0 35px #aaff00;
  margin-bottom: 65px;
}

h1 {
  color: #ffc400;
  font-size: clamp(35px, 7vw, 65px);
  margin-bottom: 28px;
}

.members {
  color: #ffc400;
  font-size: clamp(23px, 4vw, 40px);
  font-weight: bold;
  margin-bottom: 55px;
}

.pills {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
  margin-bottom: 65px;
}

.pill {
  padding: 17px 30px;
  border: 2px solid #ffca28;
  border-radius: 50px;
  color: #ffc400;
  font-size: 25px;
  font-weight: bold;
}

.red {
  border-color: #ff321f;
  color: #ff432c;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 65px;
}

.stat {
  background: #101010;
  border: 2px solid #282828;
  border-radius: 28px;
  padding: 45px 8px;
}

.stat h2 {
  color: #ffc400;
  font-size: clamp(25px, 5vw, 42px);
  margin-bottom: 25px;
}

.stat p {
  color: #999;
  font-size: 22px;
}

.stat:nth-child(2) {
  border-color: #72252a;
}

.stat:nth-child(2) h2 {
  color: #ff454f;
}

.telegram {
  display: block;
  text-decoration: none;
  background: linear-gradient(100deg, #198b37, #d9232e);
  color: white;
  font-size: clamp(23px, 5vw, 42px);
  font-weight: bold;
  padding: 48px 10px;
  border-radius: 40px;
  margin-bottom: 80px;
  box-shadow: 0 0 25px #222;
}

.features {
  border: 2px solid #393939;
  border-radius: 40px;
  padding: 45px 10px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.feature .emoji {
  font-size: 40px;
  margin-bottom: 25px;
}

.feature p {
  color: #aaa;
  font-size: 18px;
}

@media(max-width: 480px) {
  .container {
    padding: 45px 20px 30px;
  }

  .profile {
    margin-bottom: 55px;
  }

  .pills {
    gap: 12px;
  }

  .pill {
    font-size: 18px;
    padding: 14px 18px;
  }

  .stats {
    gap: 10px;
  }

  .stat {
    padding: 28px 4px;
    border-radius: 20px;
  }

  .stat p {
    font-size: 15px;
  }

  .telegram {
    padding: 32px 8px;
    border-radius: 28px;
    margin-bottom: 55px;
  }

  .features {
    padding: 30px 5px;
  }

  .feature .emoji {
    font-size: 28px;
  }

  .feature p {
    font-size: 13px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- Profile Photo -->
  <img src="profile.jpg" class="profile" alt="Mukul Profile">

  <h1>🏏 Mukul King</h1>

  <div class="members">
    👥 21K+ Active Members
  </div>

  <div class="pills">
    <div class="pill">🏆 Elite Analyst</div>
    <div class="pill red">⚡ Live Updates</div>
  </div>

  <div class="stats">
    <div class="stat">
      <h2>25,892</h2>
      <p>Match Tips</p>
    </div>

    <div class="stat">
      <h2>94%</h2>
      <p>Win Rate</p>
    </div>

    <div class="stat">
      <h2>4.9★</h2>
      <p>Rating</p>
    </div>
  </div>

  <a class="telegram"
href="https://t.me/+IytSrp_4rq04MWE9"
target="_blank">
     ✈️ Join Telegram Channel
  </a>

  <div class="features">
    <div class="feature">
      <div class="emoji">🟢</div>
      <p>Verified</p>
    </div>

    <div class="feature">
      <div class="emoji">🔒</div>
      <p>Secure</p>
    </div>

    <div class="feature">
      <div class="emoji">📈</div>
      <p>Profitable</p>
    </div>

    <div class="feature">
      <div class="emoji">⭐</div>
      <p>Top Rated</p>
    </div>
  </div>

</div>
</body>
</html>
