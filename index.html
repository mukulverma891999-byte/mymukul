
<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Mukul King</title>

<style>
* {
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body {
 background:#050505;
 color:white;
 font-family:Arial,sans-serif;
}

.container {
 width:100%;
 max-width:500px;
 min-height:100svh;
 margin:auto;
 padding:12px 16px;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:space-evenly;
 background:radial-gradient(ellipse,#181600,#050505);
 overflow:hidden;
}

.profile {
 width:clamp(105px,27vw,155px);
 height:clamp(105px,27vw,155px);
 border-radius:50%;
 border:5px solid #b5ff00;
 object-fit:cover;
 box-shadow:0 0 22px #aaff00;
}

h1 {
 color:#ffc400;
 font-size:clamp(27px,8vw,38px);
 margin-top:5px;
}

.members {
 color:#ffc400;
 font-size:clamp(17px,5vw,23px);
 font-weight:bold;
 margin-top:5px;
}

.pills {
 display:flex;
 justify-content:center;
 gap:10px;
 margin:8px 0;
 flex-wrap:wrap;
}

.pill {
 padding:9px 15px;
 border:1px solid #ffca28;
 border-radius:30px;
 color:#ffc400;
 font-size:14px;
 font-weight:bold;
}

.red {
 border-color:#ff321f;
 color:#ff432c;
}

.stats {
 width:100%;
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 margin:8px 0;
}

.stat {
 background:#101010;
 border:1px solid #333;
 border-radius:17px;
 padding:17px 3px;
 text-align:center;
}

.stat h2 {
 color:#ffc400;
 font-size:clamp(19px,6vw,26px);
 margin-bottom:9px;
}

.stat p {
 color:#aaa;
 font-size:13px;
}

.stat:nth-child(2) {
 border-color:#72252a;
}

.stat:nth-child(2) h2 {
 color:#ff454f;
}

.telegram {
 width:100%;
 display:block;
 text-decoration:none;
 text-align:center;
 background:linear-gradient(100deg,#198b37,#d9232e);
 color:white;
 font-size:clamp(19px,5.5vw,25px);
 font-weight:bold;
 padding:17px 5px;
 border-radius:18px;
 margin:10px 0;
}

.features {
 width:100%;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 border:1px solid #393939;
 border-radius:18px;
 padding:15px 5px;
 text-align:center;
}

.emoji {
 font-size:23px;
 margin-bottom:8px;
}

.feature p {
 color:#aaa;
 font-size:11px;
}

@media(max-height:700px) {
 .container {
  padding:6px 13px;
 }
 .profile {
  width:95px;
  height:95px;
 }
 .stat {
  padding:12px 2px;
 }
 .telegram {
  padding:13px 5px;
  margin:5px 0;
 }
 .features {
  padding:10px 4px;
 }
}
</style>
</head>
